{% extends "base.html" %}

{% block title %}
  {{ object|yesno:"Update,Create" }} task
{% endblock %}

{% block content %}

<div class="page-header d-print-none mb-4">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">
        Tasks
      </div>

      <h2 class="page-title">
        {{ object|yesno:"Update,Create" }} task
      </h2>
    </div>
  </div>
</div>


<div class="row">
  <div class="col-lg-8">

    <div class="card">
      <div class="card-body">

        <form method="post">
          {% csrf_token %}

          {{ form.as_p }}

          <div class="mt-4 d-flex gap-2">

            <button
                type="submit"
                class="btn btn-primary"
            >
              Save
            </button>

            <a
                href="{% url 'tasks:task-list' %}"
                class="btn btn-outline-secondary"
            >
              Cancel
            </a>

          </div>
        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
