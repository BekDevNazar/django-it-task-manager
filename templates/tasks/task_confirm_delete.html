{% extends 'base.html' %}
{% block title %}
  <h1>Delete task</h1>
{% endblock %}
{% block content %}
  <form action="" method="post">
    <p>Are you sure you want to delete "{{ task.name }}"?</p>
    {% csrf_token %}
    <input type="submit" value="Delete">

  </form>
  <a href="{% url 'tasks:task-detail' object.pk %}">
      Cancel
  </a>
{% endblock %}
