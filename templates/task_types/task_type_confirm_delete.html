{% extends "base.html" %}

{% block title %}
  Delete task type
{% endblock %}

{% block content %}
  <h1>Delete task type</h1>

  <p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}

    <button type="submit">
      Confirm delete
    </button>
  </form>

  <p>
    <a href="{% url 'references:task-type-list' %}">
      Cancel
    </a>
  </p>
{% endblock %}
