{% extends "base.html" %}

{% block title %}
  {% if object %}
    Update task type
  {% else %}
    Create task type
  {% endif %}
{% endblock %}

{% block content %}

<div class="page-header d-print-none mb-4">
  <div class="row align-items-center">
    <div class="col">
      <div class="page-pretitle">
        References
      </div>

      <h2 class="page-title">
        {% if object %}
          Update task type
        {% else %}
          Create task type
        {% endif %}
      </h2>
    </div>
  </div>
</div>


<div class="row">
  <div class="col-lg-6">

    <div class="card">

      <form method="post">
        {% csrf_token %}

        <div class="card-body">
          {{ form.as_p }}
        </div>

        <div class="card-footer bg-transparent">
          <div class="btn-list justify-content-end">

            <a
                href="{% url 'references:task-type-list' %}"
                class="btn btn-outline-secondary"
            >
              Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
              Save
            </button>

          </div>
        </div>

      </form>

    </div>

  </div>
</div>

{% endblock %}
