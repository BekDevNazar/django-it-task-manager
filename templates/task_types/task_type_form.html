{% extends "base.html" %}

{% block title %}
  {% if object %}
    Update task type
  {% else %}
    Create task type
  {% endif %}
{% endblock %}

{% block content %}
  <h1>
    {% if object %}
      Update task type
    {% else %}
      Create task type
    {% endif %}
  </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      Save
    </button>
  </form>

  <p>
    <a href="{% url 'references:task-type-list' %}">
      Cancel
    </a>
  </p>
{% endblock %}
