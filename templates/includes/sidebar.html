<aside>
  <ul>
    {% if user.is_authenticated %}
      <li>
        User: {{ user.get_username }}
      </li>

      <li>
        <a href="{% url 'tasks:task-list' %}">
          Tasks
        </a>
      </li>

      <li>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      </li>
    {% else %}
      <li>
        <a href="{% url 'login' %}?next={{ request.path }}">
          Login
        </a>
      </li>
    {% endif %}
  </ul>
</aside>
